<!-- templates/preload.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>模型下载中</title>
    <style>
        .log-container {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .log-line {
            margin: 0;
            padding: 2px 0;
        }
        .model-status {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>模型下载进度</h1>
    
    <div class="model-list">
        {% for model_name, model_path in models.items() %}
            <div class="model-status">
                <h3>{{ model_name }}</h3>
                <p>保存路径: {{ model_path }}</p>
                <div class="log-container" id="log-{{ model_name | replace('/', '-') }}">
                    <!-- 日志内容将通过JavaScript动态填充 -->
                    <p class="log-line">正在连接到日志流...</p>
                </div>
            </div>
        {% endfor %}
    </div>
    
    <a href="/">返回首页</a>
    
    <script>
        // 为每个模型创建日志事件源
        {% for model_name, model_path in models.items() %}
            (function() {
                const modelId = "{{ model_name | replace('/', '-') }}";
                const logContainer = document.getElementById("log-" + modelId);
                
                // 创建EventSource连接
                const eventSource = new EventSource("/download_log/{{ model_name }}");
                
                eventSource.onmessage = function(event) {
                    // 添加新的日志行
                    const logLine = document.createElement("p");
                    logLine.className = "log-line";
                    logLine.textContent = event.data;
                    logContainer.appendChild(logLine);
                    
                    // 自动滚动到底部
                    logContainer.scrollTop = logContainer.scrollHeight;
                };
                
                eventSource.onerror = function() {
                    // 在错误时添加提示
                    const errorLine = document.createElement("p");
                    errorLine.className = "log-line error";
                    errorLine.textContent = "日志连接中断，可能是下载已完成或出现错误";
                    logContainer.appendChild(errorLine);
                    eventSource.close();
                };
            })();
        {% endfor %}
    </script>
</body>
</html>
