<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>训练日志</title>
</head>
<body>
    <h1>训练日志</h1>
    <pre id="log_area">加载中...</pre>

<script>
    const evtSource = new EventSource("/log_stream");
    evtSource.onmessage = function(event) {
        document.getElementById("log_area").textContent += event.data + "\n";
    };
</script>
</body>
</html>
